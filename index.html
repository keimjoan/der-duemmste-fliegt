<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Der Dümmste fliegt – das Quiz, bei dem die dümmste Antwort ein Herz kostet. Moderator-Pult, Bühne im Stream-Look, Joker-Roulette, geheimes Voting und Finale.">
<title>Der Dümmste fliegt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  /* Spätabends im Stream-Studio: tiefes Tintenblau, Neon-Cyan für "wer ist dran",
     Herz-Pink für Leben, Gold für Joker. Layout: Bühne 16:9 wie ein Stream-Overlay,
     daneben das Moderator-Pult. */
  --ink: #070b1c;
  --ink-2: #0c1330;
  --panel: #111a3c;
  --panel-2: #172150;
  --line: rgba(130, 160, 255, 0.18);
  --text: #eef2ff;
  --muted: #98a4d4;
  --neon: #3fe0ff;
  --heart: #ff3d6e;
  --gold: #ffc93c;
  --ok: #35f0a0;
  --bad: #ff4d5e;
  --font-display: "Bungee", "Arial Black", Impact, system-ui, sans-serif;
  --font-body: "Rubik", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--neon); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.hidden { display: none !important; }
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }

/* ---------- Bedienelemente ---------- */
.btn {
  text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 18px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
  font-weight: 600; letter-spacing: 0.2px; transition: transform .08s, background .15s, border-color .15s, opacity .15s;
  text-align: center;
}
.btn:hover:not(:disabled) { border-color: rgba(160, 190, 255, .45); background: #1d2860; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: linear-gradient(180deg, #4fe6ff, #1fb7e0); color: #03202c; border-color: transparent; font-weight: 700; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #7aeeff, #36c6ec); }
.btn.ok { background: linear-gradient(180deg, #46f5ab, #1cc985); color: #022316; border-color: transparent; font-weight: 700; }
.btn.bad { background: linear-gradient(180deg, #ff6a78, #e5384a); color: #2a0006; border-color: transparent; font-weight: 700; }
.btn.gold { background: linear-gradient(180deg, #ffd96b, #f2a900); color: #3a2500; border-color: transparent; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.big { min-height: 58px; font-size: 19px; padding: 12px 22px; border-radius: 14px; }
.btn.block { width: 100%; }
.btn kbd { font-family: inherit; font-size: 12px; opacity: .65; border: 1px solid currentColor; border-radius: 6px; padding: 0 5px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.grow { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
input.inp, select.inp, textarea.inp {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: #0a1130; color: var(--text); font-size: 16px;
}
textarea.inp { min-height: 220px; resize: vertical; font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
input.inp:focus, select.inp:focus, textarea.inp:focus { border-color: var(--neon); outline: none; box-shadow: 0 0 0 3px rgba(63, 224, 255, .2); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  background: #0a1130; border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted);
}
.pill.live { color: var(--ok); border-color: rgba(53, 240, 160, .4); }
.pill.warn { color: var(--gold); border-color: rgba(255, 201, 60, .4); }
.pill.err { color: var(--bad); border-color: rgba(255, 77, 94, .45); }
.card {
  background: linear-gradient(180deg, var(--panel), #0e1636);
  border: 1px solid var(--line); border-radius: 16px; padding: 16px;
}
.card h3 { font-size: 15px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; font-weight: 700; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 9px 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 -3px 0 var(--neon); }
.avatar-dot {
  width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: color-mix(in srgb, var(--pc, #3fe0ff) 35%, #0a1030); box-shadow: 0 0 0 2px var(--pc, #3fe0ff);
  font-size: 17px; line-height: 1;
}
.hearts-inline { display: inline-flex; gap: 2px; vertical-align: middle; }
.hearts-inline svg { width: 16px; height: 16px; }
.hearts-inline .off path { fill: transparent; stroke: #56608c; stroke-width: 2; }
.hearts-inline .on path { fill: var(--heart); }

/* ---------- Logo ---------- */
.logo { display: inline-flex; flex-direction: column; align-items: flex-start; line-height: .92; position: relative; user-select: none; }
.logo .l1 { font-family: var(--font-display); letter-spacing: .12em; font-size: var(--l1, 22px); color: var(--text); text-shadow: 0 0 14px rgba(63, 224, 255, .45); }
.logo .l2 {
  font-family: var(--font-display); font-size: var(--l2, 46px); letter-spacing: .02em;
  background: linear-gradient(95deg, #ff4f8f 0%, #ff7a59 45%, #ffc93c 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 16px rgba(255, 61, 110, .45));
  display: inline-flex; align-items: center; gap: .18em;
}
.logo .plane { width: .95em; height: .95em; flex: none; filter: drop-shadow(0 0 10px rgba(63, 224, 255, .7)); }
.logo .trail { position: absolute; right: -0.15em; top: 18%; width: 2.2em; height: 1.2em; pointer-events: none; }

/* ---------- Startseite ---------- */
.home { position: relative; flex: 1; overflow: hidden; }
.home .bg { position: absolute; inset: 0; opacity: .32; filter: blur(1.5px) saturate(1.1); pointer-events: none; }
.home .front { position: relative; height: 100%; overflow-y: auto; display: grid; place-items: center; padding: 28px 16px; }
.home-card {
  width: min(560px, 100%); background: rgba(10, 16, 44, .86); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 22px; padding: 28px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; gap: 18px;
}
.home-card .logo { --l1: 26px; --l2: 64px; align-self: center; }
.home-card .tagline { text-align: center; color: var(--muted); margin: -4px 0 4px; }
.home-card .choices { display: grid; gap: 12px; }
.choice {
  display: grid; grid-template-columns: 52px 1fr; gap: 14px; align-items: center; text-align: left;
  padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: #0d153a;
}
.choice:hover { border-color: rgba(63, 224, 255, .55); background: #111c4b; }
.choice .ico { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; background: #18225a; }
.choice b { display: block; font-size: 18px; }
.choice span { color: var(--muted); font-size: 14px; }
.rules-mini { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
.rules-mini ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- Moderator-Ansicht ---------- */
.host { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 430px; min-height: 0; }
.host .stage-area { position: relative; min-width: 0; min-height: 0; background: #04060f; }
.host .panel { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: #0a1029; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.host.stage-only { grid-template-columns: 1fr; }
.host.stage-only .panel { display: none; }
.stage-only-hint {
  position: absolute; right: 14px; top: 14px; z-index: 5; opacity: 0; transition: opacity .2s;
}
.host.stage-only .stage-area:hover .stage-only-hint { opacity: 1; }
.panel-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.panel-head .title { font-family: var(--font-display); font-size: 18px; letter-spacing: .04em; }
.qcard { display: flex; flex-direction: column; gap: 12px; }
.qcard .who { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
.qcard .qtext { font-size: 21px; font-weight: 600; line-height: 1.3; }
.qcard .answer {
  border-radius: 12px; padding: 10px 14px; background: rgba(53, 240, 160, .08); border: 1px dashed rgba(53, 240, 160, .45);
  font-size: 19px; font-weight: 700; color: #b9ffe0;
}
.qcard .answer small { display: block; font-size: 12px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.qcard .flag-mini { width: 120px; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.qcard .flag-mini svg { display: block; width: 100%; height: auto; }
.result-chip { font-weight: 800; font-size: 17px; padding: 8px 12px; border-radius: 10px; }
.result-chip.right { background: rgba(53, 240, 160, .15); color: var(--ok); }
.result-chip.wrong { background: rgba(255, 77, 94, .15); color: var(--bad); }
.progress { height: 6px; border-radius: 6px; background: #1b2557; overflow: hidden; }
.progress > i { display: block; height: 100%; background: linear-gradient(90deg, var(--neon), #8b7bff); }
.plist { display: flex; flex-direction: column; gap: 6px; }
.prow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: #0d1538; border: 1px solid transparent; }
.prow.out { opacity: .5; }
.prow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.prow .conn { width: 9px; height: 9px; border-radius: 50%; background: #3a4570; flex: none; }
.prow .conn.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.prow .ic { min-width: 30px; min-height: 30px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); background: transparent; font-weight: 700; }
.prow .ic:hover { border-color: var(--neon); }
.wronglist { display: flex; flex-direction: column; gap: 8px; }
.wrong-item { padding: 8px 10px; border-radius: 10px; background: #0d1538; border-left: 4px solid var(--bad); }
.wrong-item .q { font-weight: 600; }
.wrong-item .a { font-size: 14px; color: var(--muted); }
.voterow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: #0d1538; }
.voterow .st { margin-left: auto; font-weight: 700; font-size: 14px; }
.voterow .st.done { color: var(--ok); }
.code-box {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 14px;
  background: linear-gradient(120deg, rgba(63, 224, 255, .12), rgba(255, 61, 110, .1)); border: 1px solid rgba(63, 224, 255, .35);
}
.code-box .code { font-family: var(--font-display); font-size: 34px; letter-spacing: .14em; }
.final-ans { display: grid; grid-template-columns: 1fr; gap: 8px; }
.final-ans .fa { padding: 10px 12px; border-radius: 12px; background: #0d1538; display: flex; flex-direction: column; gap: 8px; }
.final-ans .fa .t { font-size: 18px; font-weight: 700; word-break: break-word; }
.kbd-help { font-size: 12.5px; color: var(--muted); }
.kbd-help kbd { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; font-family: inherit; }
.details summary { cursor: pointer; font-weight: 700; color: var(--muted); list-style: none; display: flex; align-items: center; gap: 8px; }
.details summary::-webkit-details-marker { display: none; }
.details summary::before { content: "▸"; transition: transform .15s; }
.details[open] summary::before { transform: rotate(90deg); }
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.settings-grid .full { grid-column: 1 / -1; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--neon); }

/* ---------- Spieler-Ansicht ---------- */
.player { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.player .stage-area { position: relative; min-width: 0; min-height: 0; background: #04060f; }
.player .panel { min-height: 0; overflow-y: auto; border-left: 1px solid var(--line); background: #0a1029; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.pp-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pp-head .logo { --l1: 11px; --l2: 24px; }
.pp-timer { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.pp-timer.warn { color: var(--bad); }
.me-card { display: flex; align-items: center; gap: 12px; }
.me-card .avatar-dot { width: 52px; height: 52px; font-size: 30px; }
.me-card .nm { font-weight: 800; font-size: 19px; }
.big-q { font-size: 21px; font-weight: 700; line-height: 1.3; }
.turn-banner { border-radius: 14px; padding: 12px 14px; background: #0d1538; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.turn-banner.mine { border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon), 0 0 30px rgba(63, 224, 255, .25); }
.turn-banner .flag-mini { width: 160px; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.25); }
.turn-banner .flag-mini svg { display: block; width: 100%; height: auto; }
.vote-opt {
  text-align: left; padding: 12px; border-radius: 14px; border: 2px solid var(--line); background: #0d1538;
  display: flex; flex-direction: column; gap: 6px; width: 100%;
}
.vote-opt .top { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
.vote-opt .w { font-size: 14px; color: var(--muted); }
.vote-opt[aria-pressed="true"] { border-color: var(--bad); background: rgba(255, 77, 94, .12); box-shadow: 0 0 24px rgba(255, 77, 94, .25); }
.roster { display: flex; flex-direction: column; gap: 6px; }
.roster .r { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; background: #0d1538; }
.roster .r.turn { box-shadow: inset 0 0 0 2px var(--neon); }
.roster .r.out { opacity: .45; }
.roster .r .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.mini-dots { display: inline-flex; gap: 3px; }
.mini-dots i { width: 9px; height: 9px; border-radius: 50%; background: #3a4570; display: inline-block; }
.mini-dots i.right { background: var(--ok); } .mini-dots i.wrong { background: var(--bad); }
.mini-dots i.now { background: var(--neon); } .mini-dots i.joker { background: var(--gold); }
.status-line { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }

/* ---------- Bühne (1920 x 1080, skaliert) ---------- */
.stage-wrap { position: absolute; inset: 0; overflow: hidden; background: #04060f; }
.stage {
  position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
  transform: translate(-50%, -50%) scale(var(--scale, .5)); transform-origin: center center;
  background:
    radial-gradient(1100px 620px at 50% 8%, rgba(46, 80, 200, .35), transparent 70%),
    radial-gradient(900px 600px at 92% 110%, rgba(255, 61, 110, .18), transparent 70%),
    radial-gradient(800px 500px at 0% 100%, rgba(63, 224, 255, .12), transparent 70%),
    linear-gradient(180deg, #0a1028 0%, #060915 100%);
  overflow: hidden; color: var(--text); font-family: var(--font-body);
}
.stage canvas.stars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.st-top { position: absolute; left: 0; right: 0; top: 0; height: 150px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 60px; }
.st-round { font-family: var(--font-display); font-size: 40px; letter-spacing: .06em; text-shadow: 0 0 20px rgba(63, 224, 255, .5); white-space: nowrap; }
.st-round .sub { color: var(--gold); font-size: 28px; margin-left: 12px; text-shadow: 0 0 18px rgba(255, 201, 60, .45); }
.st-top .logo { --l1: 26px; --l2: 60px; }
.st-timer { justify-self: end; display: flex; align-items: center; gap: 18px; padding: 12px 22px; border-radius: 20px; background: rgba(8, 12, 34, .7); border: 2px solid rgba(130, 160, 255, .25); min-width: 250px; }
.st-timer .lbl { font-size: 18px; letter-spacing: .2em; color: var(--muted); font-weight: 800; }
.st-timer .val { font-family: var(--font-display); font-size: 56px; font-variant-numeric: tabular-nums; line-height: 1; }
.st-timer .bar { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--neon); border-radius: 0 0 0 20px; }
.st-timer { position: relative; overflow: hidden; }
.st-timer.warn { border-color: var(--bad); }
.st-timer.warn .val { color: var(--bad); animation: tpulse .5s ease-in-out infinite alternate; }
.st-timer.warn .bar { background: var(--bad); }
.st-timer.off { opacity: 0; }
.st-main { position: absolute; left: 60px; right: 60px; top: 158px; bottom: 176px; display: flex; gap: 30px; justify-content: center; }
.st-grid { position: relative; flex: 0 1 auto; display: flex; flex-wrap: wrap; gap: 26px; justify-content: center; align-content: center; }
.st-grid > .pc { flex: none; width: var(--cw, 400px); height: var(--ch, 340px); }
.st-side { width: 600px; display: none; flex-direction: column; gap: 14px; padding: 22px; border-radius: 26px; background: rgba(8, 12, 34, .75); border: 2px solid rgba(130, 160, 255, .2); overflow: hidden; }
.st-main.with-side .st-side { display: flex; }
.st-side h4 { margin: 0; font-family: var(--font-display); font-size: 30px; letter-spacing: .04em; color: var(--bad); }
.st-side .sw { display: grid; grid-template-columns: 72px 1fr; gap: 16px; align-items: start; padding: 14px 16px; border-radius: 18px; background: rgba(255, 77, 94, .08); border: 1px solid rgba(255, 77, 94, .25); }
.st-side .sw .av { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; background: color-mix(in srgb, var(--pc) 35%, #0a1030); box-shadow: 0 0 0 3px var(--pc); }
.st-side .sw .n { font-family: var(--font-display); font-size: 24px; }
.st-side .sw .q { font-size: 25px; line-height: 1.25; font-weight: 600; }
.st-side .sw .g { font-size: 26px; color: #ffb3bb; margin-top: 4px; font-weight: 700; }
.st-side .sw .c { font-size: 21px; color: var(--muted); margin-top: 2px; }
.st-side .none { font-size: 30px; font-weight: 700; color: var(--ok); margin: auto; text-align: center; }
.st-side .more { font-size: 18px; color: var(--muted); text-align: center; }
.st-bottom { position: absolute; left: 0; right: 0; bottom: 30px; height: 126px; display: flex; justify-content: center; align-items: stretch; }
.bar-box {
  width: 1560px; border-radius: 30px; display: flex; align-items: center; gap: 26px; padding: 0 30px;
  background: rgba(8, 12, 34, .85); border: 2px solid rgba(63, 224, 255, .4);
  box-shadow: 0 0 40px rgba(63, 224, 255, .18), inset 0 0 30px rgba(63, 224, 255, .06);
}
.bar-box .tag {
  flex: none; font-family: var(--font-display); font-size: 22px; letter-spacing: .08em; padding: 10px 18px; border-radius: 999px;
  background: rgba(63, 224, 255, .12); border: 2px solid rgba(63, 224, 255, .5); color: var(--neon); white-space: nowrap;
}
.bar-box .tag.red { color: #ff8b96; background: rgba(255, 77, 94, .12); border-color: rgba(255, 77, 94, .5); }
.bar-box .tag.gold { color: var(--gold); background: rgba(255, 201, 60, .12); border-color: rgba(255, 201, 60, .5); }
.bar-box .txt { flex: 1; font-size: 40px; font-weight: 700; line-height: 1.15; text-wrap: balance; text-align: center; }
.bar-box .txt.sm { font-size: 32px; }
.bar-box .txt.xs { font-size: 27px; }
.bar-box .flag { flex: none; height: 92px; width: auto; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 3px rgba(255,255,255,.35), 0 10px 30px rgba(0,0,0,.4); }
.bar-box .flag svg { display: block; height: 92px; width: auto; }
.bar-box .res { flex: none; font-family: var(--font-display); font-size: 30px; padding: 10px 20px; border-radius: 16px; }
.bar-box .res.right { color: var(--ok); background: rgba(53, 240, 160, .12); }

// Neu-Zeichnen aufschieben, solange im Panel gerade gedrückt wird (sonst gehen Klicks verloren)
function guardPointer(panel) {
  panel.down = false; panel.pending = null;
  panel.root.addEventListener('pointerdown', () => { panel.down = true; }, true);
  const up = () => {
    if (!panel.down) return; panel.down = false;
    if (panel.pending) { const f = panel.pending; panel.pending = null; setTimeout(() => panel.render(f), 0); }
  };
  window.addEventListener('pointerup', up, true);
  window.addEventListener('pointercancel', up, true);
}

      const kids = [h('div', { class: 'row' }, h('b', { class: 'grow' }, f.sd ? 'Entscheidungsfrage' : `Finalfrage ${f.i + 1}/${f.n}`), h('span', { class: 'pill' }, f.active.map(id => `${(playerById(S, id) || {}).name} ${f.score[id]}`).join(' : ')))];
      if (f.q.est) kids.push(h('span', { class: 'pill warn' }, 'Schätzfrage – wer näher dran ist, punktet'));
      if (f.q.flag) kids.push(h('div', { class: 'flag-mini', html: flagHTML(f.q.flag) }));
      kids.push(h('div', { class: 'big-q' }, f.q.q));
      if (isFin && !f.revealed) {
        const locked = me.final && me.final.locked;
        if (locked) kids.push(h('div', { class: 'result-chip right' }, 'Eingeloggt: ' + (me.final.text || '—')));
        else {
          const id = 'final-in-' + f.histLen + '-' + f.i;
          const inp = h('input', { class: 'inp', id, 'data-keep': '', maxlength: 80, placeholder: 'Deine Antwort', autocomplete: 'off', value: me.final ? me.final.text : '',
            oninput: ev => { clearTimeout(this.sendT); const val = ev.target.value; this.sendT = setTimeout(() => this.ctl.send({ t: 'final', text: val, lock: false }), 350); },
            onkeydown: ev => { if (ev.key === 'Enter') { ev.preventDefault(); this.lockFinal(id); } } });
          kids.push(inp, h('button', { class: 'btn primary big block', onclick: () => this.lockFinal(id) }, 'Einloggen'));
        }
      } else if (f.revealed) {
        kids.push(h('div', { class: 'small muted' }, 'Richtig: ' + (f.q.a || '')));
        f.active.forEach(id => { const x = playerById(S, id), m = f.marks[id]; kids.push(h('div', { class: 'row' }, h('span', { class: 'avatar-dot', style: `--pc:${x.color}` }, x.avatar), h('span', { class: 'grow' }, `${x.name}: ${f.ans[id] || '—'}`), h('b', { style: `color:${m === true ? 'var(--ok)' : m === false ? 'var(--bad)' : 'var(--muted)'}` }, m === true ? '✓' : m === false ? '✗' : '…'))); });
      } else kids.push(h('div', { class: 'small muted' }, f.active.map(id => `${(playerById(S, id) || {}).name}: ${f.locked[id] ? 'eingeloggt' : f.typing[id] ? 'tippt …' : 'denkt nach'}`).join(' · ')));
      return h('div', { class: 'turn-banner' + (isFin && !f.revealed ? ' mine' : '') }, kids);
    }
    if (ph === 'end') {
      const w = playerById(S, S.winner);
      return h('div', { class: 'card stack' }, h('b', null, w ? `${w.avatar} ${w.name} gewinnt!` : 'Spielende'), h('ol', { class: 'small', style: 'margin:0;padding-left:20px' }, (S.ranking || []).map((id, i, a) => h('li', null, (playerById(S, id) || {}).name, i === a.length - 1 && a.length > 2 ? ' – der Dümmste' : ''))));
    }
    return null;
  }
  lockFinal(id) { const el = document.getElementById(id); clearTimeout(this.sendT); this.ctl.send({ t: 'final', text: el ? el.value : '', lock: true }); }
  wrongs(S, list) {
    if (!list.length) return h('div', { class: 'small', style: 'color:var(--ok)' }, 'Alle hatten alles richtig!');
    return h('div', { class: 'wronglist' }, list.map(w => { const p = playerById(S, w.pid); return h('div', { class: 'wrong-item' }, h('b', null, p ? p.name : '?'), h('div', { class: 'q' }, w.q), h('div', { class: 'a' }, (w.given ? `„${w.given}“ · ` : '') + 'richtig: ' + w.a)); }));
  }
  roster(S, me) {
    const list = S.players;
    return h('div', { class: 'card' }, h('h3', null, 'Spieler'), h('div', { class: 'roster' }, list.map(p => {
      const turn = S.phase === 'turn' && S.turn && S.turn.pid === p.id;
      return h('div', { class: 'r' + (turn ? ' turn' : '') + (p.out ? ' out' : '') },
        h('span', { class: 'avatar-dot', style: `--pc:${p.color}` }, p.avatar), h('span', { class: 'nm' }, p.name + (me && me.id === p.id ? ' (du)' : '')),
        h('span', { class: 'mini-dots' }, (p.dots || []).map(d => h('i', { class: d.r || '' }))),
        h('span', { html: heartsInline(p.hearts, S.s.lives) }));
    })));
  }
  frame() {
    const el = document.getElementById('pp-timer'), S = this.ctl.S; if (!el || !S) return;
    const t = S.timer, show = t && ['turn', 'vote', 'tb', 'final'].includes(S.phase) && !S.roulette;
    if (!show) { if (el.textContent) el.textContent = ''; return; }
    const left = t.paused ? t.left : Math.max(0, t.end - (Date.now() + this.ctl.offset));
    const txt = t.expired ? '00:00' : fmtClock(left); if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('warn', !t.paused && left <= 5000);
  }
}

// =========================================================================
//  App-Steuerung & Bildschirme
// =========================================================================
const App = {
  root: null, host: null, hostView: null, player: null, stage: null, cleanup: [],
  clear() {
    this.cleanup.forEach(fn => { try { fn(); } catch (e) { /* egal */ } }); this.cleanup = [];
    modalStack.slice().forEach(m => m.close());
    this.root.textContent = '';
  },
  syncSound() { if (this.hostView && this.hostView.stage) this.hostView.stage.opts.sound = Sfx.on; if (this.playerStage) this.playerStage.opts.sound = Sfx.on && !!this.playerSound; },
  // ---------- Startseite ----------
  home() {
    if (this.player) { this.player.close(); this.player = null; }
    if (this.host) { this.host.destroy(); this.host = null; this.hostView = null; }

    this.clear();
    const bg = h('div', { class: 'bg', 'aria-hidden': 'true' });
    const saved = store.get('ddf-host', null);
    const canResume = saved && saved.G && saved.G.phase && saved.G.phase !== 'end' && saved.G.players && saved.G.players.length && Date.now() - (saved.savedAt || 0) < 1000 * 60 * 60 * 12;
    const prof = store.get('ddf-player', null);
    const card = h('div', { class: 'home-card' },
      h('div', { html: logoHTML() }),
      h('p', { class: 'tagline' }, 'Das Quiz, bei dem nicht der verliert, der am meisten falsch hat – sondern wer die dümmste Antwort gibt.'),
      h('div', { class: 'choices' },
        h('button', { class: 'choice', onclick: () => this.chooseMode() }, h('span', { class: 'ico' }, '🎙️'), h('div', null, h('b', null, 'Spiel moderieren'), h('span', null, 'Fragen stellen, bewerten, Voting leiten'))),
        h('button', { class: 'choice', onclick: () => this.joinScreen() }, h('span', { class: 'ico' }, '📱'), h('div', null, h('b', null, 'Spiel beitreten'), h('span', null, 'Mit Code als Mitspieler auf Handy oder PC'))),
        canResume ? h('button', { class: 'choice', onclick: () => this.startHost(null, saved.G) }, h('span', { class: 'ico' }, '⏯️'), h('div', null, h('b', null, 'Letztes Spiel fortsetzen'), h('span', null, `${saved.G.phase === 'lobby' ? 'Lobby' : saved.G.phase.startsWith('final') ? 'Finale' : 'Runde ' + saved.G.round} · ${saved.G.players.length} Spieler`))) : null,
        prof && prof.code ? h('button', { class: 'choice', onclick: () => this.join(prof.code, prof) }, h('span', { class: 'ico' }, '↩️'), h('div', null, h('b', null, `Wieder beitreten: ${prof.code}`), h('span', null, `als ${prof.avatar || ''} ${prof.name}`))) : null),
      h('div', { class: 'rules-mini' }, h('b', null, 'Kurz erklärt'), h('ul', null,
        h('li', null, '3 Herzen, pro Runde 2 Fragen für jeden, 30 Sekunden Zeit.'),
        h('li', null, 'Nach jeder Runde geheimes Voting: Die dümmste Antwort kostet ein Herz.'),
        h('li', null, 'Joker gibt deine Frage per Roulette an jemand anderen weiter.'),
        h('li', null, 'Die letzten zwei spielen das Finale – übrige Herzen zählen als Punkte.')),
        h('button', { class: 'btn small ghost', style: 'margin-top:8px', onclick: showRules }, 'Alle Regeln')));
    this.root.appendChild(h('div', { class: 'home' }, bg, h('div', { class: 'front' }, card)));
    const demo = new StageView(bg, { sound: false });
    demo.update(demoState(), 0);
    this.cleanup.push(() => demo.destroy());
  },
  chooseMode() {
    const av = onlineAvailability();
    openModal(m => [
      h('h2', null, 'Wie wollt ihr spielen?'),
      h('button', { class: 'choice', onclick: () => { m.close(); this.startHost('local'); } }, h('span', { class: 'ico' }, '🖥️'), h('div', null, h('b', null, 'Auf einem Gerät'), h('span', null, 'Alle schauen auf einen Bildschirm oder du teilst ihn auf Discord. Abgestimmt wird in der Wahlkabine oder du trägst die Stimmen ein.'))),
      h('button', { class: 'choice', disabled: !av.ok, onclick: () => { m.close(); this.startHost('online'); } }, h('span', { class: 'ico' }, '🌐'), h('div', null, h('b', null, 'Online mit Code'), h('span', null, av.ok ? 'Mitspieler treten mit Handy oder PC bei: Joker drücken, geheim abstimmen, im Finale tippen.' : av.why))),
      h('div', { class: 'row end' }, h('button', { class: 'btn ghost', onclick: m.close }, 'Abbrechen'))
    ]);
  },
  // ---------- Moderator ----------
  startHost(mode, G) {
    this.clear();
    const engine = new Engine(G ? JSON.parse(JSON.stringify(G)) : Engine.fresh(mode || 'local'));
    if (G) { engine.G.players.forEach(p => { p.conn = false; }); }
    const ctl = new HostCtl(engine); this.host = ctl;
    const stageArea = h('div', { class: 'stage-area' });
    const panelEl = h('div', { class: 'panel', id: 'host-panel' });
    const shell = h('div', { class: 'host' }, stageArea, panelEl);
    this.root.appendChild(shell);
    const stage = new StageView(stageArea, { sound: Sfx.on });
    stageArea.appendChild(h('button', { class: 'btn small stage-only-hint', onclick: () => this.toggleStageOnly() }, 'Pult zeigen (B)'));
    const panel = new HostPanel(panelEl, ctl);
    this.hostView = { stage, panel, shell };
    ctl.views.add(S => { stage.update(S, 0); panel.render('auto'); });
    this.cleanup.push(() => { stage.destroy(); });
    ctl.publishNow();
    if (engine.G.mode === 'online') ctl.goOnline();
    window.__ddf = { engine, ctl };
  },
  endHost() {
    const done = () => { store.del('ddf-host'); this.home(); };
    const G = this.host && this.host.e.G;
    if (G && (G.mode === 'online' || !['lobby', 'end'].includes(G.phase))) return confirmModal('Spiel beenden?', G.mode === 'online' ? 'Der Spielstand wird gelöscht und die Mitspieler werden getrennt.' : 'Der Spielstand wird gelöscht.', 'Beenden', done);
    done();
  },
  toggleStageOnly() { if (!this.hostView) return; this.hostView.shell.classList.toggle('stage-only'); setTimeout(() => this.hostView && this.hostView.stage.fit(), 30); },
  // ---------- Beitreten ----------
  joinScreen(code) {
    this.clear();
    const prof = store.get('ddf-player', {}) || {};
    let avatar = prof.avatar && AVATARS.includes(prof.avatar) ? prof.avatar : pick(AVATARS);
    const codeIn = h('input', { class: 'inp', id: 'join-code', maxlength: 4, autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', placeholder: 'ABCD', value: code || '', style: 'font-family:var(--font-display);font-size:28px;letter-spacing:.2em;text-transform:uppercase;text-align:center' });
    const nameIn = h('input', { class: 'inp', id: 'join-name', maxlength: 16, autocomplete: 'nickname', placeholder: 'Dein Name', value: prof.name || '' });
    const grid = h('div', { class: 'avatar-grid', role: 'group', 'aria-label': 'Avatar wählen' });
    const drawGrid = () => { grid.textContent = ''; AVATARS.forEach(a => grid.appendChild(h('button', { type: 'button', 'aria-pressed': String(a === avatar), 'aria-label': 'Avatar ' + a, onclick: () => { avatar = a; drawGrid(); } }, a))); };
    drawGrid();
    const av = onlineAvailability();
    const go = ev => {
      if (ev) ev.preventDefault();
      const c = codeIn.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, ''), n = cleanName(nameIn.value);
      if (c.length !== 4) { toast('Der Code hat 4 Zeichen.'); codeIn.focus(); return; }
      if (!n) { toast('Bitte gib einen Namen ein.'); nameIn.focus(); return; }
      const same = prof.code === c && prof.name === n;
      this.join(c, { name: n, avatar, pid: same ? prof.pid : null });
    };
    const form = h('form', { class: 'home-card', onsubmit: go },
      h('div', { html: logoHTML() }),
      h('h2', { style: 'font-size:20px;text-align:center' }, 'Spiel beitreten'),
      !av.ok ? h('p', { class: 'small', style: 'color:var(--gold)' }, av.why) : null,
      h('label', { class: 'field', for: 'join-code' }, 'Spielcode vom Moderator', codeIn),
      h('label', { class: 'field', for: 'join-name' }, 'Name', nameIn),
      h('div', { class: 'field' }, 'Avatar', grid),
      h('button', { class: 'btn primary big block', type: 'submit', disabled: !av.ok }, 'Beitreten'),
      h('button', { class: 'btn ghost block', type: 'button', onclick: () => this.home() }, 'Zurück'));
    this.root.appendChild(h('div', { class: 'home' }, h('div', { class: 'front' }, form)));
    setTimeout(() => (code ? nameIn : codeIn).focus(), 50);
  },
  join(code, profile) {
    if (this.player) { this.player.close(); this.player = null; }
    this.clear();
    try { history.replaceState(null, '', location.pathname + location.search + '#join-' + code); } catch (e) { /* egal */ }
    const ctl = new PlayerCtl(code, Object.assign({}, profile)); this.player = ctl;
    const stageArea = h('div', { class: 'stage-area' });
    const panelEl = h('div', { class: 'panel' });
    this.root.appendChild(h('div', { class: 'player' }, stageArea, panelEl));
    const panel = new PlayerPanel(panelEl, ctl);
    let stage = null;
    const wide = () => window.innerWidth > 1100;
    const ensureStage = () => { if (!stage && wide()) { stage = new StageView(stageArea, { sound: false }); this.playerStage = stage; if (ctl.S) stage.update(ctl.S, ctl.offset); } };
    ensureStage();
    const onResize = () => ensureStage(); window.addEventListener('resize', onResize);
    ctl.on(() => { panel.render(); if (stage && ctl.S) stage.update(ctl.S, ctl.offset); });
    let raf = 0; const loop = () => { raf = requestAnimationFrame(loop); panel.frame(); }; loop();
    this.cleanup.push(() => { cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); if (stage) stage.destroy(); this.playerStage = null; });
    panel.render();
    ctl.connect();
    window.__ddfp = ctl;
  },
  // ---------- Nur Bühne (zweiter Tab) ----------
  stageOnly() {
    this.clear();
    const area = h('div', { class: 'stage-area', style: 'position:fixed;inset:0' });
    this.root.appendChild(area);
    const stage = new StageView(area, { sound: false });
    const wait = h('div', { class: 'toast', style: 'bottom:auto;top:16px' }, 'Warte auf den Moderator-Tab in diesem Browser …');
    document.body.appendChild(wait);
    const snd = h('button', { class: 'btn small', style: 'position:fixed;right:12px;bottom:12px;z-index:5;opacity:.6' }, 'Ton aus');
    snd.onclick = () => { Sfx.unlock(); stage.opts.sound = !stage.opts.sound; snd.textContent = stage.opts.sound ? 'Ton an' : 'Ton aus'; };
    document.body.appendChild(snd);
    const mirror = new Mirror('stage');
    mirror.onState = S => { wait.remove(); stage.update(S, 0); };
    mirror.send({ t: 'hello' });
    const iv = setInterval(() => { if (!stage.S) mirror.send({ t: 'hello' }); }, 2000);
    this.cleanup.push(() => { clearInterval(iv); stage.destroy(); wait.remove(); snd.remove(); });
  }
};

function demoState() {
  const P = (id, name, avatar, color, hearts, dots, joker = true) => ({ id, name, avatar, color, hearts, joker, out: hearts === 0, outOrder: 0, conn: true, device: false, dots: dots.map(r => ({ r })) });
  return {
    v: 1, phase: 'turn', round: 3, mode: 'local', code: null, host: 'Demo',
    s: { lives: 3, qpp: 2, joker: true, jokerMode: 'roulette', onlyWrong: true, finalQuestions: 10, heartBonus: true },
    players: [
      P('a', 'Anna', '🦊', COLORS[0], 3, ['right', 'now']), P('b', 'Ben', '🐸', COLORS[1], 2, ['wrong', null], false), P('c', 'Cem', '🐼', COLORS[2], 3, ['right', null]),
      P('d', 'Dana', '🦉', COLORS[3], 1, ['right', null]), P('e', 'Emil', '🐙', COLORS[4], 2, ['wrong', null]), P('f', 'Fiona', '🦄', COLORS[5], 3, ['right', null]),
      P('g', 'Gregor', '🐢', COLORS[6], 0, []), P('h', 'Hannah', '🐝', COLORS[7], 2, ['right', null])
    ],
    turn: { i: 9, n: 14, pid: 'a', q: 'Welches Tier kann seine Augen unabhängig voneinander bewegen?', flag: null, result: null, given: '', a: null, jokerFrom: null, next: 'b' },
    roulette: null, jokerUsed: null, timer: { end: Date.now() + 24000, dur: 30000, paused: true, left: 24000, expired: false },
    review: null, vote: null, reveal: null, final: null, winner: null, ranking: null, fx: null, now: Date.now()
  };
}

// ---------- Tastatur für den Moderator ----------
document.addEventListener('keydown', ev => {
  const ctl = App.host; if (!ctl || !App.hostView || modalStack.length) return;
  const tg = ev.target;
  if (tg && tg.matches && tg.matches('input, textarea, select')) { if (ev.key === 'Escape') tg.blur(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase(), e = ctl.e, G = e.G, panel = App.hostView.panel;
  if ((k === ' ' || k === 'enter') && tg && tg.closest && tg.closest('button, a, summary')) return;
  let handled = true;
  if (k === 'r' && G.phase === 'turn') panel.markFromPanel('right');
  else if (k === 'f' && G.phase === 'turn') panel.markFromPanel('wrong');
  else if (k === 'a') { if (G.phase === 'turn') e.swapQuestion(); else if (G.phase === 'final') e.finalSwap(); }
  else if (k === 'j' && G.phase === 'turn') panel.hostJoker();
  else if (k === 'p') e.pauseTimer();
  else if (k === 'b') App.toggleStageOnly();
  else if (k === 'm') { Sfx.on = !Sfx.on; store.set('ddf-sound', Sfx.on); App.syncSound(); panel.render(); toast(Sfx.on ? 'Ton an' : 'Ton aus', 1200); }
  else if (k === ' ' || k === 'enter') {
    const t = e.cur();
    if (G.phase === 'turn' && t && t.result) e.next();
    else if (G.phase === 'review') e.startVote();
    else if (G.phase === 'vote' || G.phase === 'tb') e.reveal();
    else if (G.phase === 'reveal') e.proceed();
    else if (G.phase === 'finalIntro') e.finalQuestion();
    else if (G.phase === 'final') { if (!G.final.revealed) e.finalReveal(); else e.finalNext(); }
    else handled = false;
  } else handled = false;
  if (handled) ev.preventDefault();
});

// ---------- Start ----------
async function detectServer() {
  // server.js markiert die ausgelieferte Seite – so braucht es keine Test-Anfrage
  ENV.server = ENV.isHttp && !ENV.inClaude && document.documentElement.getAttribute('data-ddf-server') === '1';
}
function route(data) {
  const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (hash === 'buehne') return App.stageOnly();
  const m = hash.match(/^join-([a-z0-9]{4})$/i);
  if (m) {
    const prof = store.get('ddf-player', null);
    if (prof && prof.code === m[1].toUpperCase() && prof.name) return App.join(prof.code, prof);
    return App.joinScreen(m[1].toUpperCase());
  }
  if (data && data.G && data.G.players) return App.startHost(null, data.G);
  App.home();
}
async function start(data) {
  App.root = document.getElementById('app');
  await detectServer();
  route(data);
}
window.addEventListener('hashchange', () => {
  const hash = location.hash.replace(/^#/, '');
  if (hash === 'buehne' && !App.host) App.stageOnly();
});
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
